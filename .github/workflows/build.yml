name: build

on: [push, pull_request]

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2
          coverage: none

      - name: Select Laravel version
        run: |
          composer require --no-update --no-interaction \
            illuminate/http:${{ matrix.laravel }} \
            illuminate/console:${{ matrix.laravel }} \
            illuminate/support:${{ matrix.laravel }} \
            illuminate/filesystem:${{ matrix.laravel }}

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Run unit tests
        run: vendor/bin/phpunit --colors=always
